name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pet
          POSTGRES_PASSWORD: pet
          POSTGRES_DB: pet_aggregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: 'web/package-lock.json' }
      - run: cd web && npm ci
      # Прод получает схему только через миграции (Railway preDeploy) — проверяем, что они применяются
      # на пустой БД и что коллекции не изменены без новой миграции
      - name: Migrations apply + no schema drift
        run: |
          PGPASSWORD=pet psql -h localhost -U pet -d pet_aggregator_test -c "CREATE DATABASE pet_migrate_check;"
          cd web
          NODE_ENV=production npm run migrate
          npm run migrate:create -- drift-check --skip-empty
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::Коллекции изменены без миграции — запусти npm run migrate:create"; git status --porcelain migrations; exit 1
          fi
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_migrate_check
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
      - run: cd web && npm run typecheck
      - run: cd web && npm run lint
      - run: cd web && npm test
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_aggregator_test
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
      - run: cd web && npx playwright install --with-deps chromium
      # e2e опираются на демо-каталог (seed Plan 2) и тестовых пользователей; даты urgent считаются от дня запуска
      - run: cd web && npm run seed
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_aggregator_test
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
      - run: cd web && npm run test:e2e
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_aggregator_test
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
          TELEGRAM_BOT_USERNAME: pet_aggregator_bot
      - run: cd web && npm run build
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_aggregator_test
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
      - name: Lighthouse CI
        run: cd web && npx lhci autorun
        env:
          DATABASE_URL: postgresql://pet:pet@localhost:5432/pet_aggregator_test
          PAYLOAD_SECRET: ci-test-secret-32-characters-aaaa
